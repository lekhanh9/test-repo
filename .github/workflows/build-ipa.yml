name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"

      - name: Generate Xcode project
        working-directory: ghost-escape
        run: xcodegen generate

      - name: Build unsigned archive
        working-directory: ghost-escape
        run: >
          xcodebuild -project ghost-escape.xcodeproj
          -scheme ghost-escape
          -sdk iphoneos
          -configuration Release
          -archivePath build/ghost-escape.xcarchive
          archive
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        working-directory: ghost-escape
        run: |
          mkdir -p Payload
          cp -R build/ghost-escape.xcarchive/Products/Applications/ghost-escape.app Payload/
          zip -r ghost-escape.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-escape-unsigned
          path: ghost-escape/ghost-escape.ipa
          if-no-files-found: error
